<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background-color: #0f0d1a;
      }
      body {
        overflow: hidden;
      }
      /* Barres de défilement aux couleurs de l'app */
      * {
        scrollbar-width: thin;
        scrollbar-color: #6d5a8f transparent;
      }
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: linear-gradient(180deg, #8a6fb8, #b8805a);
        border-radius: 10px;
        border: 3px solid transparent;
        background-clip: padding-box;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: linear-gradient(180deg, #a588d4, #d48f52);
        background-clip: padding-box;
        border: 3px solid transparent;
      }
      ::-webkit-scrollbar-button,
      ::-webkit-scrollbar-corner {
        display: none;
        background: transparent;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>
  <body>
    <noscript>Dream Map a besoin de JavaScript pour fonctionner.</noscript>
    <div id="root"></div>
  </body>
</html>
