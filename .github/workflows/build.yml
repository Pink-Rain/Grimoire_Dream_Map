# Fabrique l'installateur PC (.exe) et l'APK Android de test, les publie dans « Releases »,
# puis met à jour la page de présentation (GitHub Pages).
# Se lance à chaque mise à jour de main, quand le message du commit contient [build],
# ou à la main depuis l'onglet « Actions ».
name: Build

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || contains(github.event.head_commit.message, '[build]')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx expo export -p web --output-dir dist
      - name: Code secret Google (depuis les secrets GitHub, jamais dans le dépôt)
        working-directory: desktop
        shell: bash
        env:
          SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: |
          node -e "require('fs').writeFileSync('google-oauth.json', JSON.stringify({ clientSecret: process.env.SECRET || '' }))"
      - name: Installateur Windows
        working-directory: desktop
        run: |
          npm ci
          npx electron-builder --win nsis --x64 --publish never "-c.extraMetadata.version=${{ needs.check.outputs.version }}"
      # Mise à jour légère de l'app PC (sans réinstaller) : web-<version>.gz + web-update.json, à côté de l'installateur
      # (tous les fichiers dans le même dossier, sinon la publication les range dans des sous-dossiers).
      - run: node scripts/pack-web.mjs dist desktop/release
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          # latest.yml + .blockmap : utilisés par la mise à jour automatique de l'app PC.
          path: |
            desktop/release/*.exe
            desktop/release/*.exe.blockmap
            desktop/release/latest.yml
            desktop/release/web-*.gz
            desktop/release/web-update.json

  android:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install --clean
      - name: APK de test
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - run: mv android/app/build/outputs/apk/release/app-release.apk "Grimoire-Dream-Map-${{ needs.check.outputs.version }}-test.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: '*.apk'

  release:
    needs: [check, windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          name: Grimoire - Dream Map ${{ needs.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          # La version de main est toujours « la dernière » (l'app y cherche les mises à jour), même si une
          # fabrication de test sur une branche a créé l'étiquette avant elle.
          make_latest: ${{ github.ref == 'refs/heads/main' && 'true' || 'false' }}
          overwrite_files: true
          files: out/*
          body: |
            **PC (Windows)** : télécharge `Grimoire-Dream-Map-Setup-${{ needs.check.outputs.version }}.exe` et lance-le.
            **Téléphone (Android, test)** : télécharge le fichier `.apk` sur le téléphone et ouvre-le.

  # Page de présentation : https://<compte>.github.io/<dépôt>/ (seulement depuis main).
  pages:
    needs: [check, release]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Préparer la page (numéro de version et liens de téléchargement)
        run: |
          cp -r site _site
          node scripts/build-site.mjs _site
          sed -i "s/__VERSION__/${{ needs.check.outputs.version }}/g; s#__REPO__#${{ github.repository }}#g" _site/*.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}
      # GitHub met parfois quelques secondes à voir le paquet qu'on vient d'envoyer.
      - run: sleep 20
      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
