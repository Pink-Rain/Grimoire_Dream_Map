# Fabrique l'installateur PC (.exe) et l'APK Android de test, puis les publie dans « Releases ».
# Se lance quand le message du commit contient [build], ou à la main depuis l'onglet « Actions ».
name: Build

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build]')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx expo export -p web --output-dir dist
      - name: Installateur Windows
        working-directory: desktop
        run: |
          npm ci
          npx electron-builder --win nsis --x64 --publish never "-c.extraMetadata.version=${{ needs.check.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: desktop/release/*.exe

  android:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install --clean
      - name: APK de test
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - run: mv android/app/build/outputs/apk/release/app-release.apk "Grimoire-Dream-Map-${{ needs.check.outputs.version }}-test.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: '*.apk'

  release:
    needs: [check, windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          name: Grimoire - Dream Map ${{ needs.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          overwrite_files: true
          files: out/*
          body: |
            **PC (Windows)** : télécharge `Grimoire-Dream-Map-Setup-${{ needs.check.outputs.version }}.exe` et lance-le.
            **Téléphone (Android, test)** : télécharge le fichier `.apk` sur le téléphone et ouvre-le.
